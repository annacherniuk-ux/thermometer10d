<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<header class="bg-white shadow-md p-4 flex justify-between">
  <h1>ThermoPro</h1>
  <nav class="space-x-4">
    <a href="index.html">Головна</a>
    <a href="reviews.html">Відгуки</a>
    <a href="contacts.html">Контакти</a>
  </nav>
</header>

<section class="py-16 max-w-xl mx-auto px-6">
  <h1 class="text-3xl font-bold mb-6">Контакти</h1>

  <p>📞 Телефон: +380 00 000 00 00</p>
  <p>📧 Email: info@gmail.com</p>

<section id="form" class="py-20">
    <div class="max-w-xl mx-auto px-6 bg-white p-8 rounded-2xl shadow-xl">
      <h2 class="text-3xl font-bold mb-6 text-center">Оформити замовлення</h2>
      <form class="mt-6 space-y-4"> <input type="text" placeholder="Ваше ім'я" class="w-full p-3 border rounded"> <input type="tel" placeholder="Телефон" class="w-full p-3 border rounded"> <textarea placeholder="Ваше повідомлення" class="w-full p-3 border rounded"></textarea> <button class="bg-blue-600 text-white px-6 py-3 rounded">Відправити</button> </form>
<script>
const form = document.querySelector("form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = form.querySelector("input[type='text']").value;
  const phone = form.querySelector("input[type='tel']").value;
  const message = form.querySelector("textarea").value;

  const data = {
    name: name,
    phone: phone,
    message: message
  };

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbwr4GQfhtu5CDxKYlXKG8HYgl1rjbUoZJNeyCg7TMw7Eirfcgbo81HZcw2-eqO_J-KY/exec", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.status === "success") {
      alert("Заявку відправлено ✅");
      form.reset();
    } else {
      alert("Помилка 😢");
    }

  } catch (error) {
    alert("Помилка відправки 😢");
  }
});
</script>
	</script>
		</section>
<div class="mt-10 text-center">
  <h2 class="text-2xl font-semibold mb-3">📍 Наш офіс у Парижі</h2>
  <p class="text-gray-600 mb-4">
    Тут знаходиться наш головний офіс, де ми завжди раді допомогти вам.
  </p>

  <div class="rounded-xl overflow-hidden shadow-md max-w-md mx-auto">
    <iframe
      src="https://maps.google.com/maps?q=48.8584,2.2945&z=15&output=embed"
      width="100%"
      height="250"
      style="border:0;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>
</div>
</body>
</html>
